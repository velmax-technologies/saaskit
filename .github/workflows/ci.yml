name: SaaSKit CI

on:
  push:
    branches:
      - master
      - ci/github-actions
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saaskit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test and smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose
        run: |
          docker --version
          docker compose version

      - name: Prepare environment files
        run: |
          cp .env.example .env
          cp app/.env.example app/.env

          sed -i \
            's/^DB_PASSWORD=.*/DB_PASSWORD=ci-saaskit-password/' \
            .env app/.env

          sed -i \
            's/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=ci-root-password/' \
            .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Create external proxy network
        run: docker network create saaskit-proxy

      - name: Build application images
        run: docker compose build app worker scheduler

      - name: Install Composer dependencies
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            -e COMPOSER_HOME=/tmp/composer \
            app composer install \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

      - name: Generate Laravel application key
        run: |
          docker compose run --rm --no-deps app \
            php artisan key:generate --force

      - name: Start application stack
        run: docker compose up -d --wait

      - name: Run database migrations
        run: docker compose exec -T app php artisan migrate --force

      - name: Run automated tests
        run: docker compose exec -T app php artisan test

      - name: Check API health endpoint
        run: |
          response="$(docker compose exec -T nginx \
            wget -qO- http://127.0.0.1/api/v1/health)"

          echo "$response"
          echo "$response" | grep -q '"success":true'

      - name: Show service status on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=150

      - name: Clean up Docker resources
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          docker network rm saaskit-proxy || true
